<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      position: fixed;
      top: 0; left: 0;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- Use an animated GIF as the loading screen background -->
  <img src="loading.gif" alt="Loading...">
  <!-- Background music support -->
  <audio id="audioPlayer" autoplay></audio>
  <script>
    // Explicitly list all your music files here
    const musicFiles = [
      "music1.mp3",
      "music2.mp3",
      "music3.mp3",
      "music4.mp3",
      "music5.mp3",
    ];

    let currentTrack = 0;
    const audioPlayer = document.getElementById('audioPlayer');
    audioPlayer.volume = 0.2;
    function playTrack(index) {
      audioPlayer.src = musicFiles[index];
      audioPlayer.play();
    }

    audioPlayer.addEventListener('ended', () => {
      currentTrack++;
      if (currentTrack < musicFiles.length) {
        playTrack(currentTrack);
      } else {
        currentTrack = 0; // Loop back (optional)
        // playTrack(currentTrack);
      }
    });

    // Start playing the first track
    playTrack(currentTrack);
  </script>
</body>
</html>
