<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      position: fixed;
      top: 0; left: 0;
      z-index: 1;
      pointer-events: none;
    }
    #mute-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      background: #222;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
      opacity: 0.8;
      z-index: 10;
      transition: opacity 0.2s;
    }
    #mute-btn:hover { opacity: 1; }
  </style>
</head>
<body>
  <!-- Use an animated GIF as the loading screen background -->
  <img src="loading.gif" alt="Loading...">
  <!-- Background music support -->
  <audio id="audioPlayer" autoplay></audio>
  <button id="mute-btn">Mute Music</button>
  <script>
    // Explicitly list all your music files here
    const musicFiles = [
      "music1.mp3",
      "music2.mp3",
      "music3.mp3",
      "music4.mp3",
      "music5.mp3",
    ];

    let currentTrack = 0;
    const audioPlayer = document.getElementById('audioPlayer');
    audioPlayer.volume = 0.2;
    function playTrack(index) {
      audioPlayer.src = musicFiles[index];
      audioPlayer.play();
    }

    audioPlayer.addEventListener('ended', () => {
      currentTrack++;
      if (currentTrack < musicFiles.length) {
        playTrack(currentTrack);
      } else {
        currentTrack = 0; // Loop back (optional)
        // playTrack(currentTrack);
      }
    });

    // Start playing the first track
    playTrack(currentTrack);

    // Mute/unmute button logic
    const muteBtn = document.getElementById('mute-btn');
    muteBtn.onclick = function() {
      audioPlayer.muted = !audioPlayer.muted;
      muteBtn.textContent = audioPlayer.muted ? "Unmute Music" : "Mute Music";
    };
  </script>
</body>
</html>
